spring:
  application:
    name: aea-api

  profiles:
    # 'demo' seeds the TechStore users. Harmless locally, and must be off
    # anywhere holding real data.
    active: ${SPRING_PROFILES_ACTIVE:demo}

  # SECURITY-CRITICAL: the runtime connects as aea_app, which has neither
  # BYPASSRLS nor table ownership. Connecting as aea_owner would silently
  # disable tenant isolation for the whole platform.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aea}
    username: ${DB_USER:aea_app}
    password: ${DB_PASSWORD:aea_app_dev_only}
    hikari:
      maximum-pool-size: 10
      # Connections are reused across tenants. app.tenant_id is therefore set
      # with SET LOCAL inside each transaction so it is discarded at commit,
      # never leaking a tenant into the next borrower of the connection.
      pool-name: aea-app-pool

  flyway:
    enabled: true
    # Migrations run as the owner; the app never holds DDL rights.
    url: ${DB_MIGRATION_URL:jdbc:postgresql://localhost:5432/aea}
    user: ${DB_MIGRATION_USER:aea_owner}
    password: ${DB_MIGRATION_PASSWORD:aea_owner_dev_only}
    locations: classpath:db/migration
    baseline-on-migrate: false

aea:
  auth:
    # SECURITY-CRITICAL: must be at least 32 bytes; the app refuses to start
    # otherwise rather than issue forgeable tokens. Generate with:
    #   openssl rand -base64 48
    # The default below is a development value and is public in this repo.
    # It must be replaced by an injected secret in any real deployment.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-replace-me-000000000000}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}

server:
  port: ${API_PORT:8080}
  error:
    include-message: never      # no internal detail in error bodies
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.aea: DEBUG
